<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="container">
        <h1><span aria-label="Weather" role="img">☀️</span> Weather App</h1>
        <form id="weatherForm" autocomplete="off">
            <input type="text" id="cityInput" placeholder="Enter city name" aria-label="City name" required autofocus>
            <button type="submit" aria-label="Get Weather">Get Weather</button>
        </form>
        <div id="loader" class="loader" style="display:none;"></div>
        <div id="weatherResult" class="weather-result"></div>
    </div>
    <footer class="footer">Powered by <a href="https://openweathermap.org/" target="_blank" rel="noopener">OpenWeatherMap</a></footer>
    <script src="assets/app.js"></script>
</body>
</html>
